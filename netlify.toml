# Netlify — frontend (Vite + React) do SGIServiteng.
# O backend (Express + Socket.io + Prisma) NÃO corre no Netlify: ver docs/deploy-netlify.md.

[build]
  base = "client"
  # client/ importa ../connectors, que depende do socket.io-client instalado na raiz
  command = "npm ci --prefix .. && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL é definido no painel do Netlify (Site configuration → Environment variables)

# A app usa HashRouter, mas isto protege acessos diretos a /qualquer-coisa
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
